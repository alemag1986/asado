name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C app typecheck
      - run: pnpm -C app test
      - run: pnpm -C app build

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --manifest-path api/Cargo.toml --check
      - run: cargo clippy --manifest-path api/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path api/Cargo.toml

  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: 3.13
      - run: uv sync --extra dev
      - run: uv run pytest
      - run: uv run python scripts/synth_pairs.py
      - run: uv run python eval/make_golden.py
      - run: uv run python scripts/format_dataset.py --in data/synth_pairs.jsonl --golden eval/golden.jsonl --check
      - run: uv run python eval/score.py --mock
